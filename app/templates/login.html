<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - cnAgentOS</title>
    {% include "_portal_assets.html" %}
    <link rel="stylesheet" href="{{ static_url('css/base.css') }}">
</head>
<body class="auth-page">
    <div class="auth-wrap">
        <section class="auth-hero">
            <div class="kicker"><i class="fas fa-star me-2"></i>cnAgentOS</div>
            <h1>欢迎登录<br>智能瞭望与问数平台</h1>
            <p>请选择登录身份：普通用户进入用户门户，管理员进入后台工作台。</p>
        </section>
        <section class="auth-panel glass-strong">
            <div class="auth-title">账号登录</div>
            <div class="auth-subtitle">请输入账号和密码完成身份验证</div>

            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            {% end %}
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% end %}

            <form method="post" action="/auth/login" id="loginForm" novalidate>
                {% module xsrf_form_html() %}
                <input type="hidden" name="login_type" id="loginTypeInput" value="{{ login_type }}">

                <div class="auth-type-tabs">
                    <label>
                        <input type="radio" name="login_type_ui" value="user" {% if login_type == 'user' %}checked{% end %}>
                        <span><i class="fas fa-user"></i>普通用户</span>
                    </label>
                    <label>
                        <input type="radio" name="login_type_ui" value="admin" {% if login_type == 'admin' %}checked{% end %}>
                        <span><i class="fas fa-user-shield"></i>管理员</span>
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="username">用户名</label>
                    <input class="form-control form-control-lg" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required style="width: 100%;">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="password">密码</label>
                    <input class="form-control form-control-lg" id="password" type="password" name="password" placeholder="请输入密码" autocomplete="current-password" required style="width: 100%;">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="submitBtn">进入系统</button>
            </form>

            <div class="auth-footer-links" id="registerLinkWrap">
                <span>还没有账号？</span>
                <a href="/auth/register">立即注册</a>
            </div>
        </section>
    </div>

    <script src="{{ static_url('js/base.js') }}"></script>
    <script src="{{ static_url('js/voice.js') }}"></script>
    <script>
        (function () {
            const loginTypeInput = document.getElementById('loginTypeInput');
            const submitBtn = document.getElementById('submitBtn');
            const registerWrap = document.getElementById('registerLinkWrap');
            const radios = document.querySelectorAll('input[name="login_type_ui"]');

            function syncLoginType() {
                const selected = document.querySelector('input[name="login_type_ui"]:checked');
                const value = selected ? selected.value : 'user';
                loginTypeInput.value = value;
                submitBtn.textContent = value === 'admin' ? '进入管理后台' : '进入用户首页';
                if (registerWrap) {
                    registerWrap.style.display = value === 'user' ? 'block' : 'none';
                }
            }

            radios.forEach((radio) => radio.addEventListener('change', syncLoginType));
            syncLoginType();

            var form = document.getElementById('loginForm');
            if (form) {
                form.addEventListener('submit', function () {
                    sessionStorage.setItem('voice_welcome', '1');
                });
            }
        })();
    </script>
</body>
</html>
