<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/bootstrap-5.3.8-dist/css/bootstrap.min.css') }}" />
    <link rel="stylesheet" href="{{ static_url('dist/fontawesome-free-5.15.4-web/css/all.min.css') }}" />
    <link rel="stylesheet" href="{{ static_url('css/admin.css') }}" />
    <link rel="stylesheet" href="{{ static_url('css/watch.css') }}" />
</head>
<body class="watch-shell">
    <div class="watch-container">
        <!-- 顶部导航 -->
        <header class="watch-header">
            <div class="watch-logo">
                <i class="fas fa-satellite-dish"></i>
                <span>智能瞭望</span>
            </div>
            <nav class="watch-nav">
                <a href="/admin/watch-sources" class="active"><i class="fas fa-search"></i> 数据采集</a>
                <a href="/admin/watch-records"><i class="fas fa-database"></i> 数据仓库</a>
                <a href="/"><i class="fas fa-home"></i> 返回首页</a>
            </nav>
            <div class="watch-user">
                <span class="user-badge"><i class="fas fa-user-circle"></i> {{ username }}</span>
            </div>
        </header>

        <!-- 主采集区 -->
        <main class="watch-main">
            <!-- 采集引擎区 -->
            <section class="engine-section">
                <div class="engine-glow"></div>
                <div class="engine-core">
                    <h1 class="engine-title">
                        <i class="fas fa-globe-asia"></i>
                        智能数据采集引擎
                    </h1>
                    <p class="engine-subtitle">输入采集意图，AI 自动识别关键词并调度多源采集</p>

                    <form id="collectForm" class="engine-form">
                        {% module xsrf_form_html() %}
                        <div class="search-wrapper">
                            <i class="fas fa-search search-icon"></i>
                            <input
                                type="text"
                                name="prompt"
                                id="prompt"
                                class="search-input"
                                placeholder="例如：收集四川农业大学的新闻，20条"
                                autocomplete="off"
                            />
                            <button type="submit" class="search-btn" id="searchBtn">
                                <i class="fas fa-bolt"></i>
                                <span>开始采集</span>
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- 采集源选择面板 -->
            <section class="sources-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-layer-group"></i> 采集源配置</h3>
                    <span class="panel-badge">{{ len(sources) }} 个可用源</span>
                </div>

                <div class="sources-grid">
                    {% for source in sources %}
                    <div class="source-card {% if source['is_enabled'] %}enabled{% else %}disabled{% end %}" data-source-id="{{ source['id'] }}">
                        <div class="source-header">
                            <div class="source-info">
                                <h4>{{ source['name'] }}</h4>
                                <span class="source-code">{{ source['source_code'] }}</span>
                            </div>
                            <label class="source-toggle">
                                <input type="checkbox" class="source-switch" data-source-id="{{ source['id'] }}" {% if source['is_enabled'] %}checked{% end %} />
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="source-config">
                            <div class="config-row">
                                <label>每页数量</label>
                                <input type="number" class="config-input" data-source-id="{{ source['id'] }}" data-field="collect_limit" value="{{ source['collect_limit'] }}" min="1" max="50" />
                            </div>
                            <div class="config-row">
                                <label>采集页数</label>
                                <input type="number" class="config-input" data-source-id="{{ source['id'] }}" data-field="max_pages" value="1" min="1" max="10" />
                            </div>
                        </div>
                        <div class="source-footer">
                            <span class="source-note">{{ source['note'] or '暂无说明' }}</span>
                        </div>
                    </div>
                    {% end %}
                </div>
            </section>

            <!-- 实时采集流 -->
            <section class="stream-section">
                <div class="panel-header">
                    <h3><i class="fas fa-stream"></i> 采集实时流</h3>
                    <span class="stream-status" id="streamStatus">等待采集...</span>
                </div>
                <div class="stream-box" id="streamBox">
                    <div class="stream-placeholder">
                        <i class="fas fa-satellite"></i>
                        <p>输入采集意图后，实时数据流将在此显示</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ static_url('js/watch.js') }}"></script>
    <script>
        // 采集源开关逻辑
        document.querySelectorAll('.source-switch').forEach(switchEl => {
            switchEl.addEventListener('change', async (e) => {
                const sourceId = e.target.dataset.sourceId;
                const isEnabled = e.target.checked ? 1 : 0;
                const card = e.target.closest('.source-card');
                
                // 更新卡片状态
                if (isEnabled) {
                    card.classList.add('enabled');
                    card.classList.remove('disabled');
                } else {
                    card.classList.add('disabled');
                    card.classList.remove('enabled');
                }

                // 发送更新请求
                try {
                    const formData = new FormData();
                    formData.append('_xsrf', document.querySelector('[name="_xsrf"]').value);
                    formData.append('name', card.querySelector('h4').textContent);
                    formData.append('source_code', card.querySelector('.source-code').textContent);
                    formData.append('is_enabled', isEnabled);
                    formData.append('collect_limit', card.querySelector('[data-field="collect_limit"]').value);
                    formData.append('entry_urls', '[]');
                    formData.append('headers', '{}');
                    formData.append('keywords_label', '关键字');
                    formData.append('page_param_name', 'pn');
                    formData.append('page_step', '10');
                    formData.append('note', card.querySelector('.source-note').textContent);

                    await fetch(`/admin/watch-sources/update/${sourceId}`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (err) {
                    console.error('更新采集源状态失败:', err);
                }
            });
        });

        // 配置输入框变更自动保存
        document.querySelectorAll('.config-input').forEach(input => {
            input.addEventListener('change', async (e) => {
                const sourceId = e.target.dataset.sourceId;
                const field = e.target.dataset.field;
                const value = e.target.value;
                const card = e.target.closest('.source-card');
                const isEnabled = card.classList.contains('enabled');

                try {
                    const formData = new FormData();
                    formData.append('_xsrf', document.querySelector('[name="_xsrf"]').value);
                    formData.append('name', card.querySelector('h4').textContent);
                    formData.append('source_code', card.querySelector('.source-code').textContent);
                    formData.append('is_enabled', isEnabled ? 1 : 0);
                    formData.append('collect_limit', card.querySelector('[data-field="collect_limit"]').value);
                    formData.append('entry_urls', '[]');
                    formData.append('headers', '{}');
                    formData.append('keywords_label', '关键字');
                    formData.append('page_param_name', 'pn');
                    formData.append('page_step', '10');
                    formData.append('note', card.querySelector('.source-note').textContent);

                    if (field === 'max_pages') {
                        // max_pages 不保存到数据库，仅用于采集时
                        return;
                    }

                    await fetch(`/admin/watch-sources/update/${sourceId}`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (err) {
                    console.error('保存配置失败:', err);
                }
            });
        });

        // 采集表单提交
        const form = document.getElementById('collectForm');
        const streamBox = document.getElementById('streamBox');
        const streamStatus = document.getElementById('streamStatus');
        const searchBtn = document.getElementById('searchBtn');

        form?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) return;

            // 获取启用的采集源和配置
            const enabledSources = [];
            document.querySelectorAll('.source-card.enabled').forEach(card => {
                const sourceId = card.dataset.sourceId;
                const itemCount = card.querySelector('[data-field="collect_limit"]').value;
                const maxPages = card.querySelector('[data-field="max_pages"]').value;
                enabledSources.push({ sourceId, itemCount, maxPages });
            });

            if (enabledSources.length === 0) {
                streamBox.innerHTML = '<div class="stream-error"><i class="fas fa-exclamation-triangle"></i> 请至少启用一个采集源</div>';
                return;
            }

            // 禁用按钮，显示加载状态
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 采集中...';
            streamStatus.textContent = '采集中...';
            streamStatus.classList.add('active');
            streamBox.innerHTML = '';

            // 依次采集每个源
            for (const source of enabledSources) {
                streamBox.innerHTML += `<div class="stream-source-header"><i class="fas fa-database"></i> 采集源 #${source.sourceId}</div>`;
                
                const formData = new FormData();
                formData.append('_xsrf', document.querySelector('[name="_xsrf"]').value);
                formData.append('prompt', prompt);
                formData.append('source_id', source.sourceId);
                formData.append('item_count', source.itemCount);
                formData.append('max_pages', source.maxPages);

                try {
                    const resp = await fetch('/admin/watch-collect', {
                        method: 'POST',
                        body: formData
                    });

                    if (!resp.ok) {
                        streamBox.innerHTML += `<div class="stream-error">请求失败</div>`;
                        continue;
                    }

                    const reader = resp.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const parts = buffer.split('\n\n');
                        buffer = parts.pop() || '';

                        for (const part of parts) {
                            const line = part.split('\n').find(x => x.startsWith('data: '));
                            if (!line) continue;
                            try {
                                const payload = JSON.parse(line.slice(6));
                                if (payload.message) {
                                    streamBox.innerHTML += `<div class="stream-line">${escapeHtml(payload.message)}</div>`;
                                    streamBox.scrollTop = streamBox.scrollHeight;
                                }
                            } catch (err) {}
                        }
                    }
                } catch (err) {
                    streamBox.innerHTML += `<div class="stream-error">采集失败：${err.message}</div>`;
                }
            }

            // 恢复按钮状态
            searchBtn.disabled = false;
            searchBtn.innerHTML = '<i class="fas fa-bolt"></i> <span>开始采集</span>';
            streamStatus.textContent = '采集完成';
            streamStatus.classList.remove('active');
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
