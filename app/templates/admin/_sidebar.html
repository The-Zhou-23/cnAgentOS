<aside class="sidebar">
  <div class="brand">
    <strong>cnAgentOS</strong>
    <span>AI 智能瞭望与智能问数系统</span>
  </div>
  <div class="nav-card">
    {% if sidebar_features %}
      {% for item in sidebar_features %}
      <a
        href="{{ item['route_path'] }}"
        class="{% if active_page == item['active_page'] %}active{% end %}"
        ><i class="{{ item['icon'] }}"></i>{{ item['name'] }}</a
      >
      {% end %}
    {% else %}
      <div class="text-secondary small px-2">暂无可用菜单，请联系超级管理员配置权限</div>
    {% end %}
  </div>
  <form action="/auth/logout" method="post" class="mt-4">
    {% module xsrf_form_html() %}
    <button class="btn btn-outline-secondary w-100">退出登录</button>
  </form>
</aside>
