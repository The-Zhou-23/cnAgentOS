<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ static_url('dist/bootstrap-5.3.8-dist/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ static_url('dist/fontawesome-free-5.15.4-web/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ static_url('dist/layui-v2.13.6/css/layui.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
</head>
<body>
    <div class="admin-login-wrap">
        <section class="admin-login-hero">
            <div class="kicker"><i class="fas fa-shield-halved"></i> 企业级管理后台</div>
            <h1 class="display-5 fw-bold mb-3">AI智能瞭望与智能问数系统</h1>
            <p class="fs-5 text-white-50 lh-lg mb-4">
                面向管理侧的沉浸式登录入口，采用简约、专业、自适应的后台设计风格。
                当前默认管理员账号为 <strong>admin / admin888</strong>。
            </p>
            <div class="row g-3 mt-4">
                <div class="col-md-6">
                    <div class="glass p-4 h-100">
                        <div class="fw-semibold mb-2"><i class="fas fa-users me-2"></i>用户管理</div>
                        <div class="text-white-50 small">支持新增、删除、修改、分页与批量管理。</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="glass p-4 h-100">
                        <div class="fw-semibold mb-2"><i class="fas fa-sitemap me-2"></i>权限体系</div>
                        <div class="text-white-50 small">支持角色、权限与菜单的统一映射。</div>
                    </div>
                </div>
            </div>
        </section>
        <section class="admin-login-card">
            <div class="glass-strong login-panel">
                <div class="kicker"><i class="fas fa-right-to-bracket"></i> 管理员登录</div>
                <h2 class="fw-bold mb-2">欢迎回来</h2>
                <div class="text-secondary mb-4">请输入管理员账号与密码进入后台。</div>
                {% if error %}
                <div class="alert alert-danger border-0">{{ error }}</div>
                {% end %}
                <form method="post" action="/admin/login">
                    {% module xsrf_form_html() %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">用户名</label>
                        <input class="form-control form-control-lg" name="username" value="admin" placeholder="admin">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">密码</label>
                        <input class="form-control form-control-lg" type="password" name="password" value="admin888" placeholder="admin888">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100"><i class="fas fa-arrow-right-to-bracket me-2"></i>进入管理后台</button>
                </form>
                <div class="text-center text-secondary small mt-4">本地化前端组件已接入，禁止引用外部 CDN。</div>
            </div>
        </section>
    </div>
    <script src="{{ static_url('dist/layui-v2.13.6/layui.js') }}"></script>
</body>
</html>
